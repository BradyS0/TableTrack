services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tabletrackdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tabletrackdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .       
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  db_data: